<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <link rel="stylesheet"
          href="/static/style.css">

</head>

<body>

    <div class="container">

        <h1>Task Manager</h1>

        <div class="add-task">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
            >

            <button onclick="addTask()">
                Add Task
            </button>

        </div>

        <h2>My Tasks</h2>

        <div id="taskList"></div>

    </div>

    <script src="/static/script.js"></script>

</body>

</html>
